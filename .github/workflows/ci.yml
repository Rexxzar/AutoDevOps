name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Cache Terraform provider plugins
        uses: actions/cache@v4
        with:
          path: internal/terraform/testdata/.terraform-plugin-cache
          key: tf-plugin-cache-${{ runner.os }}-1.15.5

      - name: Build
        run: go build ./...

      - name: Test
        env:
          AUTODEVOPS_TF_VALIDATE: "1"
        run: go test ./...

      - name: Vet
        run: go vet ./...
